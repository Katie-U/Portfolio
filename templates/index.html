{% extends "base.html" %}



{% block structured_data %}
        <!-- Tells Google who this site is about, which is what feeds a knowledge
             panel for a name search. -->
        <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@type": "Person",
            "name": "{{ owner_name }}",
            "url": "{{ canonical_url }}",
            "image": "{{ page_image }}",
            "jobTitle": "UX Researcher and Interaction Designer",
            "description": "{{ page_description }}",
            "alumniOf": [
                {"@type": "CollegeOrUniversity", "name": "Michigan Technological University"},
                {"@type": "CollegeOrUniversity", "name": "Carnegie Mellon University"}
            ],
            "sameAs": ["https://www.linkedin.com/in/katie-ulinski"]
        }
        </script>
{% endblock %}

{% block content %}
        <div class ="aboveTheFold">
            <div id = "rightFold">
                <!-- The largest element above the fold, so it is the metric Google
                     measures for LCP: never lazy-load it, and hint it as urgent. -->
                <img id ="firstImg" src = "{{ url_for('static', filename='images-webp/hero.webp') }}" fetchpriority = "high" decoding = "async" alt = "Portrait of {{ owner_name }}">
            </div>
            <div id = "leftFold">
                <div id = "nameAndTitle">
                    <h1>
                        Katie Ulinski
                    </h1>
                    <h2>
                        Research, Design, UI/UX
                    </h2>
                </div>
                <p class = "text">
                <div id = "personalLinks">
                    <a href = "https://www.github.com/Katie-U">
                        <img class = "linkPhoto" id = "githubLogo" src = "{{ url_for('static', filename='images-webp/github-logo.webp') }}" alt = "GitHub">
                    </a>
                    <!-- rel="me" lets Google tie this profile to the person the
                         JSON-LD above describes. -->
                    <a href = "https://www.linkedin.com/in/katie-ulinski" rel = "me">
                        <img class = "linkPhoto" id = "linkedinLogo" src = "{{ url_for('static', filename='images-webp/linkedin-logo.webp') }}" decoding = "async" alt = "LinkedIn">
                    </a>
                </div>

            </div>
        </div>
