<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">

        <title>{% block title %}Portfolio{% endblock %} | {{ owner_name }}</title>
        <meta name="description" content="{{ page_description }}">
        <meta name="author" content="{{ owner_name }}">

        <!-- One address per page, so the Railway subdomain, a custom domain and
             any ?query variants all credit the same URL. -->
        <link rel="canonical" href="{{ canonical_url }}">

        <!-- Link previews on LinkedIn, Slack, iMessage and the rest. -->
        <meta property="og:type" content="website">
        <meta property="og:site_name" content="{{ site_name }}">
        <meta property="og:title" content="{% block og_title %}{{ self.title() }}{% endblock %}">
        <meta property="og:description" content="{{ page_description }}">
        <meta property="og:url" content="{{ canonical_url }}">
        <meta property="og:image" content="{{ page_image }}">
        <meta name="twitter:card" content="summary_large_image">

        <!-- PNG rather than WebP: Safari still will not render a WebP favicon. -->
        <link rel="icon" href="{{ url_for('static', filename='images/home-icon.png') }}">
        <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/base.css') }}"/>
        {% block styles %}{% endblock %}
        {% block structured_data %}{% endblock %}
    </head>

    <body>
        <nav>
            
                <a class = "navLink" href = "{{ url_for('index') }}" {% if request.endpoint == 'index' %}aria-current = "page"{% endif %}>
                    <p>Home</p>
                </a>
                <a class = "navLink" href = "{{ url_for('experiences') }}" {% if request.endpoint == 'experiences' %}aria-current = "page"{% endif %}>
                    <p>Experiences</p>
                </a>
                <a class = "navLink" href = "{{ url_for('about') }}" {% if request.endpoint == 'about' %}aria-current = "page"{% endif %}>
                    <p>About</p>
                </a>
                <a class = "navLink" href = "{{ url_for('contact') }}" {% if request.endpoint == 'contact' %}aria-current = "page"{% endif %}>
                    <p>Contact</p>
                </a>
                <!--
                <a class = "navLink" href = "{{ url_for('index') }}#aboutMeDiv">
                    <p>About Me</p>
                </a>
                -->
            
        </nav>

        {% block content %}{% endblock %}

         <footer>
            <p class = "footer">Katie Ulinski - 2026</p>
            <div id = "footerLinks">
                <a class = "footerLink" href = "{{url_for('index') }}">
                    <p>Home</p>
                </a>
                <a class = "footerLink" href = "{{url_for('contact') }}">
                    <p>Contact</p>
                </a>
            </div>
        </footer>

        <script src="{{ url_for('static', filename='js/main.js') }}" defer></script>
    </body>

</html>
